[workspace]
resolver = "3"
members = ["crates/tf3-save-mapper-core", "crates/tf3-save-mapper"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WuphonsReach/tf3-save-mapper"
publish = false

[workspace.dependencies]
tf3-save-mapper-core = { path = "crates/tf3-save-mapper-core" }
memchr = "2.8"
# No legacy-format or dictionary support: a save is one plain zstd stream.
zstd = { version = "0.14", default-features = false }
# PNG encoding for the raster terrain; no default features.
png = { version = "0.18", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
