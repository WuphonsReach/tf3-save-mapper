name: Release

# Builds the `tf3map` binary for Windows, macOS and Linux, attaches build
# provenance attestations and, for a version tag, publishes a GitHub release.
# Verify a download with:
#   gh attestation verify <file> --repo WuphonsReach/tf3-save-mapper
#
# Run it by hand (Actions tab, "Run workflow") to get the archives as
# workflow artifacts without publishing anything.

on:
  push:
    # Version tags with a "v" prefix: v1.2.3 or v1.2.3-rc.1.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    # Build-only check when this file changes.
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the crate version
        if: github.ref_type == 'tag'
        run: |
          id=$(cargo pkgid -p tf3-save-mapper)
          cargo_version=${id##*[#@]}
          if [[ "$REF_NAME" != "v$cargo_version" ]]; then
            echo "::error::tag $REF_NAME does not match crate version $cargo_version"
            exit 1
          fi
        env:
          REF_NAME: ${{ github.ref_name }}

  build:
    name: build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static binary (musl), so it runs on any Linux distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar.gz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          # The bundled zstd library is C, and has to be built against musl too.
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p tf3-save-mapper --target ${{ matrix.target }}
      - name: Check the Linux build is static
        if: runner.os == 'Linux'
        run: |
          file target/${{ matrix.target }}/release/tf3map
          file target/${{ matrix.target }}/release/tf3map | grep -q "static"
      - name: Package
        id: package
        shell: bash
        run: |
          if [[ "$REF_TYPE" == tag ]]; then version="${REF_NAME#v}"; else version="${GITHUB_SHA::7}"; fi
          name="tf3map-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          ext=""; [[ "$RUNNER_OS" == Windows ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/tf3map${ext}" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create release
        run: |
          prerelease=()
          [[ "$REF_NAME" == *-* ]] && prerelease=(--prerelease)
          gh release create "$REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$REF_NAME" \
            "${prerelease[@]}" \
            --generate-notes \
            --notes "Build provenance: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`"
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
